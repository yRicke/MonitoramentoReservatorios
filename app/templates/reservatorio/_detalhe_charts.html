<section class="chart-stack">
    <article class="panel">

            <div id="chartTemperatura" class="apex-chart"></div>
            <div class="chart-empty" id="emptyTemperatura" hidden>Sem leituras de temperatura</div>
        </div>
    </article>

    <article class="panel">

    <article class="panel">
