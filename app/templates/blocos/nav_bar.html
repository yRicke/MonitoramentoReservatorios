<header class="top-nav">
    <div class="top-nav-inner">
        <div class="top-nav-left">
            <a class="brand-link" href="{% if request.user.is_authenticated %}{% url 'index' %}{% else %}{% url 'entrar' %}{% endif %}">
                <span class="brand-mark" aria-hidden="true"></span>
                <h1 class="brand">
                    <span class="brand-kicker">SISTEMA DE</span>
                    <span class="brand-title">Monitoramento</span>
                </h1>
            </a>
        </div>

        <div class="top-nav-right">
            {% if request.user.is_authenticated %}
                <span class="user-chip">
                    <span class="user-chip-label">Usuário</span>
                    <strong>{{ request.user.username }}</strong>
                </span>
                <form method="post" action="{% url 'sair' %}">
                    {% csrf_token %}
                    <button class="btn-sair" type="submit">Sair</button>
                </form>
            {% else %}
                <a class="btn-sair" href="{% url 'entrar' %}">Entrar</a>
            {% endif %}
        </div>
    </div>
</header>
