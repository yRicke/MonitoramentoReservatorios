{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a9f71">
    <title>{% block title %}Sistema{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        {% include "blocos/nav_bar.html" %}
        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
        {% include "blocos/footer.html" %}
    </div>
    <script src="{% static 'js/confirmar-exclusao-reservatorio.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
