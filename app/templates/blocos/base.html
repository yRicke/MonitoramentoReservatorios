<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema{% endblock %}</title>
    <style>
        :root {
            --bg: #dddddd;
            --surface-dark: #242633;
            --white: #ffffff;
            --green: #06bd62;
            --green-dark: #0b8b53;
            --purple: #7f4df5;
            --purple-2: #9a7ae6;
            --danger: #ff3b39;
            --status-bom: #00be6f;
            --status-atencao: #ff7a00;
            --status-perigo: #ff3434;
            --text: #151515;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .top-nav {
            background: var(--green);
            min-height: 74px;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--white);
        }

        .brand {
            margin: 0;
            font-size: 34px;
            line-height: 1;
            letter-spacing: 0.2px;
            font-weight: 800;
            text-transform: lowercase;
        }

        .brand span {
            display: block;
        }

        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 32px;
            font-weight: 700;
        }

        .btn-sair {
            border: 0;
            border-radius: 12px;
            padding: 9px 14px;
            background: var(--green-dark);
            color: var(--white);
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .page-content {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: 22px 16px 32px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .btn-main {
            border: 0;
            border-radius: 34px;
            background: linear-gradient(90deg, var(--purple), var(--purple-2));
            color: var(--white);
            padding: 12px 26px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .search {
            margin-left: auto;
            width: min(680px, 100%);
            display: flex;
            border-radius: 34px;
            overflow: hidden;
            background: linear-gradient(90deg, #9f7ce9, #8f66e2);
        }

        .search input {
            width: 100%;
            border: 0;
            background: transparent;
            padding: 13px 20px;
            color: var(--white);
            font-size: 20px;
            font-weight: 700;
        }

        .search input::placeholder {
            color: rgba(255, 255, 255, 0.85);
        }

        .search button {
            width: 70px;
            border: 0;
            background: #7c43f1;
            color: var(--white);
            font-size: 32px;
            font-weight: 700;
            cursor: pointer;
        }

        .message-wrap {
            margin: 0 0 16px;
            display: grid;
            gap: 10px;
        }

        .message {
            margin: 0;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 600;
            width: fit-content;
            max-width: 100%;
            background: #f2f2f2;
        }

        .message.success {
            background: #d7f6e8;
            color: #0f7a4f;
        }

        .message.error {
            background: #ffe3e3;
            color: #a91f1f;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 26px;
        }

        .reservatorio-card {
            background: var(--surface-dark);
            border-radius: 34px;
            padding: 28px 24px 24px;
            color: var(--white);
            min-height: 260px;
            display: flex;
            flex-direction: column;
        }

        .reservatorio-card h2 {
            margin: 0 0 20px;
            font-size: 40px;
            font-weight: 800;
            line-height: 1;
            text-align: center;
        }

        .status-pill {
            margin: 0;
            background: #f4f4f4;
            color: #000000;
            border-radius: 100px;
            padding: 10px 16px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
        }

        .status-pill span {
            font-weight: 700;
        }

        .status-text.status-bom {
            color: var(--status-bom);
        }

        .status-text.status-atencao {
            color: var(--status-atencao);
        }

        .status-text.status-perigo {
            color: var(--status-perigo);
        }

        .card-actions {
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .btn-ver {
            width: 100%;
            border: 0;
            border-radius: 34px;
            padding: 11px 16px;
            background: linear-gradient(90deg, #7f4df5, #7a46f0);
            color: var(--white);
            font-size: 26px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-delete {
            width: 56px;
            height: 56px;
            border: 0;
            border-radius: 50%;
            background: var(--danger);
            color: var(--white);
            font-size: 34px;
            font-weight: 800;
            line-height: 1;
            cursor: pointer;
        }

        .empty-state {
            background: #efefef;
            border: 2px dashed #bdbdbd;
            border-radius: 22px;
            padding: 24px;
            font-size: 18px;
            color: #555555;
        }

        .detail-hero {
            background: var(--surface-dark);
            border-radius: 28px;
            color: var(--white);
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .detail-hero h2 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 0.3px;
        }

        .detail-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #f4f4f4;
            color: #000000;
            font-size: 18px;
            font-weight: 700;
        }

        .detail-layout {
            display: grid;
            grid-template-columns: minmax(280px, 360px) 1fr;
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: #ffffff;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
        }

        .panel h3 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        .panel h4 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .edit-form {
            display: grid;
            gap: 10px;
        }

        .edit-form label {
            font-weight: 700;
            font-size: 14px;
        }

        .edit-form input,
        .edit-form select {
            border: 1px solid #d4d4d4;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .chart-wrap {
            position: relative;
            min-height: 260px;
        }

        .chart-empty {
            display: grid;
            place-items: center;
            min-height: 220px;
            border-radius: 14px;
            border: 2px dashed #d7d7d7;
            color: #666666;
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            .brand {
                font-size: 24px;
            }

            .top-nav-right {
                font-size: 22px;
            }

            .btn-sair {
                font-size: 16px;
            }

            .btn-main {
                font-size: 18px;
            }

            .search input {
                font-size: 16px;
            }

            .search button {
                font-size: 24px;
            }

            .reservatorio-card h2 {
                font-size: 28px;
            }

            .status-pill {
                font-size: 18px;
            }

            .btn-ver {
                font-size: 22px;
            }

            .detail-layout {
                grid-template-columns: 1fr;
            }

            .detail-hero h2 {
                font-size: 26px;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include "blocos/nav_bar.html" %}
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
    {% include "blocos/footer.html" %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
